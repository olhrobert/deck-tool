<card
	class="flex-1 min-w-0"
	variant="default"
	emphasis="false"
	padding="md"
	gap="sm"
>
	<card-pretitle data-slot="pretitle" color="subtle" context="surface">Label</card-pretitle>
	<card-title data-slot="title" color="strong" context="surface">Value</card-title>
	<body-copy data-slot="text" size="sm" color="base" context="surface">Optional body text</body-copy>
	<card-meta data-slot="meta" color="subtle" context="surface">Optional supporting detail</card-meta>
</card>
