<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<title>Component showcase</title>
		<link
			rel="stylesheet"
			href="../tokens/index.css"
		/>
		<link
			rel="stylesheet"
			href="../components/index.css"
		/>
		<link
			rel="stylesheet"
			href="../utilities.css"
		/>
		<link
			rel="stylesheet"
			href="app-switch.css"
		/>
		<link
			rel="stylesheet"
			href="showcase.css"
		/>
	</head>
	<body>
		<aside class="showcase-sidebar">
			<app-switch
				class="showcase-brand-switch"
				value="gratia"
				color-theme="light"
				aria-label="Brand"
			>
				<button
					type="button"
					data-value="gratia"
					aria-pressed="true"
				>
					Gratia
				</button>
				<button
					type="button"
					data-value="riverton"
					aria-pressed="false"
				>
					Riverton
				</button>
			</app-switch>
			<nav
				class="showcase-filter"
				aria-label="Showcase sections"
			></nav>
		</aside>
		<div
			class="showcase"
			id="showcase-pages"
		></div>
		<script src="showcase.js"></script>
	</body>
</html>
