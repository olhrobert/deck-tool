<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<title>The platform that creates its own supply.</title>
		<link
			rel="stylesheet"
			href="../../../design-system/tokens/index.css"
		/>
		<link
			rel="stylesheet"
			href="../../../design-system/components/index.css"
		/>
		<link
			rel="stylesheet"
			href="../../../design-system/utilities.css"
		/>
	</head>
	<body>
		<deck>
			<slide color-theme="dark">
				<content-container class="flex p-20 pr-0">
					<stack
						direction="row"
						gap="13"
						width="fill"
						height="fill"
						class="items-center"
					>
						<stack
							direction="col"
							gap="0"
							width="fill"
							height="fill"
						>
							<img
								data-slot="logo"
								data-logo
								src="../../../assets/logos/placeholder-logo.svg"
								alt="Logo"
								width="hug"
								class="shrink-0 block"
								style="height: 12px; width: auto"
							/>
							<stack
								direction="col"
								gap="4"
								width="fill"
								class="flex-1 justify-center"
							>
								<slide-title-group>
									<slide-title
										data-slot="main"
										size="lg"
										tone="strong"
										context="slide"
										lineheight="sm"
										>The platform that creates its own
										supply.</slide-title
									>
								</slide-title-group>
								<text
									data-slot="sub"
									size="350"
									tone="base"
									context="slide"
									lineheight="lg"
									>AI-coached analysts. Enterprise-ready work.
									Delivered on demand.</text
								>
							</stack>
							<stack
								direction="row"
								gap="2"
								width="fill"
								class="items-center"
								style="height: 72px"
							>
								<stack
									direction="row"
									gap="4"
									width="fill"
									height="fill"
								>
									<divider orientation="vertical"></divider>
									<stack
										direction="col"
										gap="1"
										width="fill"
										height="fill"
										class="justify-center"
									>
										<text
											data-slot="stat-value"
											family="stat"
											size="500"
											context="slide"
											style="color: var(--color-palette-brand-3)"
											>$4M</text
										>
										<text
											data-slot="stat-label"
											size="250"
											tone="subtle"
											context="slide"
											lineheight="single"
											>Annualized Run Rate</text
										>
									</stack>
								</stack>
								<stack
									direction="row"
									gap="4"
									width="fill"
									height="fill"
								>
									<divider orientation="vertical"></divider>
									<stack
										direction="col"
										gap="1"
										width="fill"
										height="fill"
										class="justify-center"
									>
										<text
											data-slot="stat-value"
											family="stat"
											size="500"
											context="slide"
											style="color: var(--color-palette-brand-3)"
											>80+</text
										>
										<text
											data-slot="stat-label"
											size="250"
											tone="subtle"
											context="slide"
											lineheight="single"
											>Active Analysts</text
										>
									</stack>
								</stack>
								<stack
									direction="row"
									gap="4"
									width="fill"
									height="fill"
								>
									<divider orientation="vertical"></divider>
									<stack
										direction="col"
										gap="1"
										width="fill"
										height="fill"
										class="justify-center"
									>
										<text
											data-slot="stat-value"
											family="stat"
											size="500"
											context="slide"
											style="color: var(--color-palette-brand-3)"
											>85%</text
										>
										<text
											data-slot="stat-label"
											size="250"
											tone="subtle"
											context="slide"
											lineheight="single"
											>Repeat Clients</text
										>
									</stack>
								</stack>
								<stack
									direction="row"
									gap="4"
									width="fill"
									height="fill"
								>
									<divider orientation="vertical"></divider>
									<stack
										direction="col"
										gap="1"
										width="fill"
										height="fill"
										class="justify-center"
									>
										<text
											data-slot="stat-value"
											family="stat"
											size="500"
											context="slide"
											style="color: var(--color-palette-brand-3)"
											>270+</text
										>
										<text
											data-slot="stat-label"
											size="250"
											tone="subtle"
											context="slide"
											lineheight="single"
											>Deployments</text
										>
									</stack>
								</stack>
							</stack>
						</stack>
						<media-slot
							data-slot="image"
							width="fill"
							height="fill"
							padding="none"
							border="false"
							style="filter: drop-shadow(0px 24px 32px rgba(0, 0, 0, 0.2)) drop-shadow(0px 20px 16px rgba(0, 0, 0, 0.5))"
						>
							<text
								size="200"
								tone="subtle"
								context="slide"
								>Image</text
							>
						</media-slot>
					</stack>
				</content-container>
			</slide>
		</deck>
	</body>
</html>
