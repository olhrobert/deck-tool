<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<title>Slide title</title>
		<link
			rel="stylesheet"
			href="../../design-system/tokens/index.css"
		/>
		<link
			rel="stylesheet"
			href="../../design-system/components/index.css"
		/>
		<link
			rel="stylesheet"
			href="../../design-system/utilities.css"
		/>
	</head>
	<body>
		<deck>
			<slide>
				<header-container>
					<slide-title-group>
						<slide-pretitle data-slot="pre" tone="subtle" context="slide"
							>Optional pre-title</slide-pretitle
						>
						<slide-title data-slot="main" size="md" tone="strong" context="slide"
							>Slide title</slide-title
						>
						<slide-subtitle data-slot="sub" tone="base" context="slide"
							>Optional subtitle</slide-subtitle
						>
					</slide-title-group>
				</header-container>
				<content-container>
					<stack direction="row" gap="2" width="fill">
						<card padding="md">
							<card-pretitle data-slot="pretitle" tone="subtle" context="surface"
								>Label</card-pretitle
							>
							<card-title data-slot="title" tone="strong" context="surface"
								>Value</card-title
							>
							<card-meta data-slot="meta" tone="subtle" context="surface"
								>Optional supporting
								detail</card-meta
							>
						</card>
						<card padding="md">
							<card-pretitle data-slot="pretitle" tone="subtle" context="surface"
								>Label</card-pretitle
							>
							<card-title data-slot="title" tone="strong" context="surface"
								>Value</card-title
							>
							<card-meta data-slot="meta" tone="subtle" context="surface"
								>Optional supporting
								detail</card-meta
							>
						</card>
						<card padding="md">
							<card-pretitle data-slot="pretitle" tone="subtle" context="surface"
								>Label</card-pretitle
							>
							<card-title data-slot="title" tone="strong" context="surface"
								>Value</card-title
							>
							<card-meta data-slot="meta" tone="subtle" context="surface"
								>Optional supporting
								detail</card-meta
							>
						</card>
					</stack>
				</content-container>
				<footer-container>
					<slide-footer>
						<img
							data-slot="logo"
							data-logo
							src="../../assets/logos/placeholder-logo.svg"
							alt="Logo"
							class="shrink-0 block"
						/>
						<slide-footer-notes data-slot="notes" tone="subtle"
							>Add notes or sources here.</slide-footer-notes
						>
						<slide-footer-meta>
							<slide-footer-title data-slot="deck-title" tone="subtle"
								>Deck title</slide-footer-title
							>
							<slide-footer-chapter data-slot="chapter" tone="subtle"
								>Chapter</slide-footer-chapter
							>
							<slide-footer-page data-slot="page" tone="subtle"
								>01</slide-footer-page
							>
						</slide-footer-meta>
					</slide-footer>
				</footer-container>
			</slide>
		</deck>
	</body>
</html>
