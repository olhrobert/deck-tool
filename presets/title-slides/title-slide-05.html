<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<title>Deck title</title>
		<link
			rel="stylesheet"
			href="../../design-system/tokens/index.css"
		/>
		<link
			rel="stylesheet"
			href="../../design-system/components/index.css"
		/>
		<link
			rel="stylesheet"
			href="../../design-system/utilities.css"
		/>
	</head>
	<body>
		<deck>
			<slide class="bg-cover">
				<div
					class="box-border w-full h-full flex items-center justify-center"
				>
					<div class="flex flex-col items-center gap-10">
						<img
							src="../../assets/logos/placeholder-logo.svg"
							alt="Logo"
							data-logo="cover"
							class="shrink-0 block"
							style="height: 40px; width: auto"
						/>
						<div class="flex flex-col items-center gap-8">
							<text
								family="cover-title"
								size="2400"
								lineheight="sm"
								class="text-center"
								tone="strong"
								context="cover"
							>
								Title of the deck
							</text>
							<body-copy
								size="sm"
								class="text-center"
								tone="subtle"
								context="cover"
							>
								Optional subtitle. Can be one or two sentences
								long.
							</body-copy>
						</div>
					</div>
				</div>
			</slide>
		</deck>
	</body>
</html>
