<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<title>Deck title</title>
		<link
			rel="stylesheet"
			href="../../design-system/tokens/index.css"
		/>
		<link
			rel="stylesheet"
			href="../../design-system/components/index.css"
		/>
		<link
			rel="stylesheet"
			href="../../design-system/utilities.css"
		/>
	</head>
	<body>
		<deck>
			<slide kind="cover">
				<div class="relative box-border w-full h-full">
					<div
						class="box-border w-full h-full flex items-center justify-center"
					>
						<div class="flex flex-col items-center gap-10">
							<img
								src="../../assets/logos/placeholder-logo.svg"
								alt="Logo"
								data-logo
								class="shrink-0 block"
								style="height: 40px; width: auto"
							/>
							<div class="flex flex-col items-center gap-8">
								<cover-title
									size="md"
									class="text-center"
									tone="strong"
									context="slide"
								>
									Title of the deck
								</cover-title>
								<body-copy
									size="sm"
									class="text-center"
									tone="subtle"
									context="slide"
								>
									Optional subtitle. Can be one or two sentences
									long.
								</body-copy>
							</div>
						</div>
					</div>

					<div
						class="absolute bottom-0 left-0 right-0 flex justify-center"
					>
						<attribution-box variant="title">
							<text data-slot="credit" size="300" tone="base" context="surface">
								Sanitized excerpt prepared by
							</text>
							<img
								data-slot="logo"
								src="../../assets/logos/gratia-logo.svg"
								alt="Gratia"
							/>
						</attribution-box>
					</div>
				</div>
			</slide>
		</deck>
	</body>
</html>
