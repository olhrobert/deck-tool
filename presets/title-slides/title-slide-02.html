<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<title>Deck title</title>
		<link
			rel="stylesheet"
			href="../../design-system/tokens/index.css"
		/>
		<link
			rel="stylesheet"
			href="../../design-system/components/index.css"
		/>
		<link
			rel="stylesheet"
			href="../../design-system/utilities.css"
		/>
	</head>
	<body>
		<deck>
			<slide kind="cover">
				<stack
					direction="col"
					gap="0"
					width="fill"
					height="fill"
					class="justify-between p-20"
				>
					<stack
						direction="row"
						gap="0"
						width="fill"
						class="justify-between items-start"
					>
						<img
							src="../../assets/logos/placeholder-logo.svg"
							alt="Logo"
							data-logo
							class="shrink-0 block"
							style="height: 24px; width: auto"
						/>

						<attribution-box variant="title">
							<text data-slot="credit" size="300" tone="base" context="surface">
								Sanitized excerpt prepared by
							</text>
							<img
								data-slot="logo"
								src="../../assets/logos/gratia-logo.svg"
								alt="Gratia"
							/>
						</attribution-box>
					</stack>

					<stack direction="col" gap="4">
						<cover-title
							size="lg"
							tone="strong"
							context="slide"
						>
							Title of this deck. Keep it concise.
						</cover-title>
						<text size="350" tone="subtle" context="slide">
							Optional subtitle. Can be one or two sentences long.
						</text>
					</stack>
				</stack>
			</slide>
		</deck>
	</body>
</html>
