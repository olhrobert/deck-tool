<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<title>Deck title</title>
		<link
			rel="stylesheet"
			href="../../design-system/tokens/index.css"
		/>
		<link
			rel="stylesheet"
			href="../../design-system/components/index.css"
		/>
		<link
			rel="stylesheet"
			href="../../design-system/utilities.css"
		/>
	</head>
	<body>
		<deck>
			<slide kind="cover">
				<div class="relative box-border w-full h-full">
					<div
						class="absolute top-0 left-0 right-0 flex justify-center pt-20"
					>
						<img
							src="../../assets/logos/placeholder-logo.svg"
							alt="Logo"
							data-logo
							class="shrink-0 block"
							style="height: 32px; width: auto"
						/>
					</div>

					<div
						class="box-border w-full h-full flex items-center justify-center"
					>
						<stack
							direction="col"
							gap="4"
							width="fill"
							class="items-center"
						>
							<cover-title
								size="lg"
								align="center"
								width="fill"
								tone="strong"
								context="slide"
							>
								Title of the deck
							</cover-title>
							<text size="350" class="text-center" tone="subtle" context="slide">
								Optional subtitle. Can be one or two sentences
								long.
							</text>
						</stack>
					</div>

					<div
						class="absolute bottom-0 left-0 right-0 flex justify-center"
					>
						<attribution-box variant="title">
							<text data-slot="credit" size="300" tone="base" context="surface">
								Sanitized excerpt prepared by
							</text>
							<img
								data-slot="logo"
								src="../../assets/logos/gratia-logo.svg"
								alt="Gratia"
							/>
						</attribution-box>
					</div>
				</div>
			</slide>
		</deck>
	</body>
</html>
