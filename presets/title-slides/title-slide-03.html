<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<title>Deck title</title>
		<link
			rel="stylesheet"
			href="../../design-system/tokens/index.css"
		/>
		<link
			rel="stylesheet"
			href="../../design-system/components/index.css"
		/>
		<link
			rel="stylesheet"
			href="../../design-system/utilities.css"
		/>
	</head>
	<body>
		<deck>
			<slide kind="cover">
				<stack
					direction="row"
					gap="0"
					width="fill"
					height="fill"
				>
					<stack
						direction="col"
						gap="0"
						width="fill"
						height="fill"
						class="justify-between items-start p-6"
					>
						<img
							src="../../assets/logos/placeholder-logo.svg"
							alt="Logo"
							data-logo
							class="shrink-0 block"
							style="height: 24px; width: auto"
						/>

						<div>
							<cover-title
								size="xl"
								lineheight="single"
								tone="strong"
								context="slide"
							>
								Title of the deck
							</cover-title>
						</div>
					</stack>

					<stack
						direction="col"
						gap="0"
						height="fill"
						class="p-0"
					>
						<attribution-box variant="title">
							<text
								data-slot="credit"
								size="300"
								tone="base"
								context="surface"
							>
								Sanitized excerpt prepared by
							</text>
							<img
								data-slot="logo"
								src="../../assets/logos/gratia-logo.svg"
								alt="Gratia"
							/>
						</attribution-box>

						<div class="flex pb-10 pr-6 w-full mt-auto">
							<text size="350" class="text-left grow" tone="subtle" context="slide">
								Optional subtitle. Can be one or two sentences
								long.
							</text>
						</div>
					</stack>
				</stack>
			</slide>
		</deck>
	</body>
</html>
