<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<title>Deck title</title>
		<link
			rel="stylesheet"
			href="../../tokens/index.css"
		/>
		<link
			rel="stylesheet"
			href="../../components/index.css"
		/>
		<link
			rel="stylesheet"
			href="../../styles/utilities.css"
		/>
	</head>
	<body>
		<deck>
			<slide class="bg-primary">
				<div class="box-border w-full h-full flex">
					<div
						class="box-border h-full grow min-w-0 flex flex-col gap-4 p-20 pb-4"
					>
						<div class="flex flex-col gap-4 grow">
							<text
								family="display"
								weight="bold"
								size="1600"
								lineheight="sm"
								class="color-text-strong"
							>
								Migrate Riverton's core banking platform from
								Symitar to FIS
							</text>

							<text
								family="base"
								weight="regular"
								size="450"
								lineheight="lg"
								class="color-text-subtle"
							>
								Over 18 months, sequenced as 3 waves with 90-day
								hypercare each.
							</text>
						</div>

						<text
							family="base"
							weight="regular"
							size="300"
							lineheight="lg"
							class="color-text-subtle"
						>
							Charter for a 9-month, $4.2M cross-functional
							program — scope, milestones, RACI, and the six risks
							that triggered weekly steering.
						</text>
					</div>
					<div
						class="box-border h-full shrink-0 flex flex-col justify-between items-start pt-24"
					>
						<svg
							role="img"
							aria-label="Riverton"
							class="shrink-0 block color-text-strong"
							style="height: 24px"
							viewBox="0 0 76 16"
							fill="none"
						>
							<use
								href="../../assets/riverton-logo.svg#riverton-logo"
							/>
						</svg>
						<div
							class="flex items-center gap-1 py-4 px-6 bg-card-bg"
						>
							<text
								size="300"
								class="color-text-base"
							>
								Sanitized excerpt prepared by
							</text>
							<img
								src="../../assets/gratia-logo.svg"
								alt="Gratia"
								class="shrink-0 block"
								style="height: 14px"
							/>
						</div>
					</div>
				</div>
			</slide>
		</deck>
	</body>
</html>
