<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<title>Slide 03</title>
		<link
			rel="stylesheet"
			href="../../design-system/tokens/index.css"
		/>
		<link
			rel="stylesheet"
			href="../../design-system/components/index.css"
		/>
		<link
			rel="stylesheet"
			href="../../design-system/utilities.css"
		/>
	</head>
	<body>
		<deck>
			<slide>
				<header-container>
					<slide-title data-slot="main">Footer preset preview</slide-title>
				</header-container>
				<content-container>
					<div class="box-border min-w-0 flex flex-col gap-6">
						<body-copy size="md" weight="regular" color="base" lineheight="lg">
							This slide uses slide-footer: logo left, optional notes, deck title, chapter, and page.
						</body-copy>
					</div>
				</content-container>
				<footer-container>
					<slide-footer context="slide">
						<img data-logo src="gratia-logo.svg" alt="Gratia" class="shrink-0 block" data-slot="logo" />
						<slide-footer-notes color="subtle" data-slot="notes">Add notes or sources here.</slide-footer-notes>
						<slide-footer-meta>
							<slide-footer-title color="subtle" data-slot="deck-title">Gratia Growth Strategy</slide-footer-title>
							<slide-footer-chapter color="subtle" data-slot="chapter">Growth</slide-footer-chapter>
							<slide-footer-page color="subtle" data-slot="page">03</slide-footer-page>
						</slide-footer-meta>
					</slide-footer>
				</footer-container>
			</slide>
		</deck>
	</body>
</html>
