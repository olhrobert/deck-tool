<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<title>Slide 03</title>
		<link
			rel="stylesheet"
			href="../../design-system/tokens/index.css"
		/>
		<link
			rel="stylesheet"
			href="../../design-system/components/index.css"
		/>
		<link
			rel="stylesheet"
			href="../../design-system/utilities.css"
		/>
	</head>
	<body>
		<deck>
			<slide>
				<slide-header>
					<slide-title data-slot="main">Footer preset preview</slide-title>
				</slide-header>
				<slide-content>
					<div class="box-border min-w-0 flex flex-col gap-6">
						<body-copy size="md" weight="regular" color="base" lineheight="lg">
							This slide uses footer-01: logo left, slide number right.
						</body-copy>
					</div>
				</slide-content>
				<slide-footer>
					<div class="flex items-center w-full">
						<div class="flex-1 flex justify-start min-w-0">
							<img
								src="gratia-logo.svg"
								alt="Gratia"
								data-logo="slide"
								class="shrink-0 block"
								style="height: 12px; width: auto"
							/>
						</div>
						<div class="flex-1 flex justify-end min-w-0">
							<text
								size="200"
								color="subtle"
								context="slide"
							>
								03
							</text>
						</div>
					</div>
				</slide-footer>
			</slide>
		</deck>
	</body>
</html>
