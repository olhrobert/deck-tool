<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<title>Slide 03</title>
		<link
			rel="stylesheet"
			href="../../design-system/tokens/index.css"
		/>
		<link
			rel="stylesheet"
			href="../../brands/gratia/brand.css"
		/>
		<link
			rel="stylesheet"
			href="../../design-system/components/index.css"
		/>
		<link
			rel="stylesheet"
			href="../../design-system/utilities.css"
		/>
	</head>
	<body>
		<deck>
			<slide>
				<slide-header>
					<slide-title>
						<slide-title-main weight="strong" data-slot="main">Footer preset preview</slide-title-main>
					</slide-title>
				</slide-header>
				<slide-content>
					<div class="box-border min-w-0 flex flex-col gap-6">
						<text
							size="base"
							weight="regular"
							tone="base"
							lineheight="lg"
						>
							This slide uses footer-02: logo left, attribution
							box centered, slide number right.
						</text>
					</div>
				</slide-content>
				<slide-footer>
					<div class="flex items-center w-full">
						<div class="flex-1 flex justify-start min-w-0">
							<svg
								role="img"
								aria-label="Gratia"
								class="shrink-0 block color-slide-foreground-strong"
								style="height: 16px"
								viewBox="0 0 65 16"
								fill="none"
							>
								<use
									href="gratia-logo.svg#gratia-logo"
								/>
							</svg>
						</div>
						<attribution-box variant="content">
							<text data-slot="disclaimer">All figures are modified to prevent reversability</text>
							<attribution-box-separator></attribution-box-separator>
							<text data-slot="prepared-by">Prepared by</text>
							<img src="../../assets/logos/gratia-logo.svg" alt="Gratia" data-slot="logo" />
						</attribution-box>
						<div class="flex-1 flex justify-end min-w-0">
							<text
								size="200"
								tone="subtle"
							>
								03
							</text>
						</div>
					</div>
				</slide-footer>
			</slide>
		</deck>
	</body>
</html>
