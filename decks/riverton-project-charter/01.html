<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<title>Slide 01</title>
		<link
			rel="stylesheet"
			href="../../design-system/tokens/index.css"
		/>
		<link
			rel="stylesheet"
			href="../../design-system/components/index.css"
		/>
		<link
			rel="stylesheet"
			href="../../design-system/utilities.css"
		/>
	</head>
	<body>
		<deck>
			<slide class="bg-cover">
				<div class="box-border w-full h-full flex">
					<div
						class="box-border h-full grow min-w-0 flex flex-col gap-4 p-20 pb-4"
					>
						<div class="flex flex-col gap-4 grow">
							<text
								family="cover-title"
								size="1600"
								lineheight="sm"
								class="color-cover-foreground-strong"
							>
								Migrate Riverton's core banking platform from
								Symitar to FIS over 18 months
							</text>

							<text
								family="body"
								weight="regular"
								size="450"
								lineheight="lg"
								class="color-cover-foreground-subtle"
							>
								Sequenced as 3 waves with 90-day hypercare each.
							</text>
						</div>

						<text
							family="body"
							weight="regular"
							size="300"
							lineheight="lg"
							class="color-cover-foreground-subtle"
						>
							Charter for a 9-month, $4.2M cross-functional
							program — scope, milestones, RACI, and the six risks
							that triggered weekly steering.
						</text>
					</div>
					<div
						class="box-border h-full shrink-0 flex flex-col justify-between items-start pt-24"
					>
						<img
							src="riverton-logo.svg"
							alt="Riverton"
							data-logo="cover"
							class="shrink-0 block"
							style="height: 24px; width: auto"
						/>
						<attribution-box variant="title">
							<text data-slot="credit">
								Sanitized excerpt prepared by
							</text>
							<img
								data-slot="logo"
								src="../../assets/logos/gratia-logo.svg"
								alt="Gratia"
							/>
						</attribution-box>
					</div>
				</div>
			</slide>
		</deck>
	</body>
</html>
